<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Register - DevChat</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#075E54] min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-3xl max-w-md w-full p-8">
<div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-green-400 to-green-700 text-white flex items-center justify-center font-extrabold text-xl mx-auto">DV</div>
<h2 class="text-2xl font-extrabold text-center mt-4">Join DevChat</h2>
<p class="text-xs text-center text-gray-500">Google, GitHub or Email & Password</p>

<div class="mt-6 grid grid-cols-2 gap-3">
<button id="googleBtn" class="border py-3 rounded-full font-bold flex items-center justify-center gap-2 text-sm"><img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5"> Google</button>
<button id="githubBtn" class="bg-black text-white py-3 rounded-full font-bold flex items-center justify-center gap-2 text-sm"><i class="fa-brands fa-github text-lg"></i> GitHub</button>
</div>

<div class="flex items-center gap-3 my-4"><div class="h-px bg-gray-200 flex-1"></div><span class="text-xs text-gray-400">OR</span><div class="h-px bg-gray-200 flex-1"></div></div>

<form id="regForm" class="space-y-3">
<input id="fullName" required placeholder="Full Name" class="w-full border rounded-xl px-3 py-2.5 text-sm">
<input id="email" type="email" required placeholder="Email address" class="w-full border rounded-xl px-3 py-2.5 text-sm">
<input id="password" type="password" required placeholder="Password (min 6 chars)" class="w-full border rounded-xl px-3 py-2.5 text-sm">
<input id="whatsapp" required placeholder="WhatsApp e.g. 2348100000000" class="w-full border rounded-xl px-3 py-2.5 text-sm">
<input id="role" required placeholder="Role e.g. Fullstack Dev" class="w-full border rounded-xl px-3 py-2.5 text-sm">
<input id="skills" required placeholder="Skills e.g. React, Node" class="w-full border rounded-xl px-3 py-2.5 text-sm">
<input id="portfolio" placeholder="Portfolio / GitHub profile link" class="w-full border rounded-xl px-3 py-2.5 text-sm">
<textarea id="bio" required placeholder="Bio / Achievements" rows="3" class="w-full border rounded-xl px-3 py-2.5 text-sm"></textarea>
<button id="submitBtn" type="submit" class="w-full bg-black text-white py-3 rounded-full font-bold">Create Account with Password</button>
</form>

<div class="mt-4 text-center">
<button onclick="toggleLogin()" id="toggleText" class="text-xs text-blue-600 underline">Already have account? Login here</button>
</div>

<form id="loginForm" class="space-y-3 hidden mt-4">
<input id="loginEmail" type="email" required placeholder="Email" class="w-full border rounded-xl px-3 py-2.5 text-sm">
<input id="loginPassword" type="password" required placeholder="Password" class="w-full border rounded-xl px-3 py-2.5 text-sm">
<button type="submit" class="w-full bg-black text-white py-3 rounded-full font-bold">Login</button>
</form>

<p class="text-[10px] text-center mt-4 text-gray-400">GitHub login will auto-fill your name & portfolio link from GitHub profile</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, GithubAuthProvider, signInWithPopup, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { getDatabase, ref, set, get, update, increment } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyD1XfAONBJW_XMV_55PMnySMb4wQ8rKywc",authDomain:"devchat-52024.firebaseapp.com",databaseURL:"https://devchat-52024-default-rtdb.firebaseio.com",projectId:"devchat-52024",storageBucket:"devchat-52024.firebasestorage.app",messagingSenderId:"906277143318",appId:"1:906277143318:web:2d81125db5ef04f3a44637",measurementId:"G-C170BY4MDK"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getDatabase(app);
const params=new URLSearchParams(location.search);const refId=params.get('ref');
let isLoginMode=false;

window.toggleLogin=()=>{
 isLoginMode=!isLoginMode;
 document.getElementById('regForm').classList.toggle('hidden', isLoginMode);
 document.getElementById('loginForm').classList.toggle('hidden', !isLoginMode);
 document.getElementById('googleBtn').parentElement.classList.toggle('hidden', isLoginMode);
 document.getElementById('toggleText').textContent = isLoginMode ? 'No account? Register here' : 'Already have account? Login here';
};

async function saveUserData(user, extra={}){
 const existing = await get(ref(db,'users/'+user.uid));
 if(existing.exists()){ localStorage.setItem('devchat_user_logged','true'); location.href='index.html'; return; }
 const data={
  uid:user.uid,
  fullName:document.getElementById('fullName').value || extra.name || user.displayName || 'Dev',
  email:document.getElementById('email').value || user.email,
  whatsapp:document.getElementById('whatsapp').value || '',
  role:document.getElementById('role').value || 'Developer',
  skills:document.getElementById('skills').value || '',
  portfolio:document.getElementById('portfolio').value || extra.portfolio || '',
  bio:document.getElementById('bio').value || '',
  photoURL:user.photoURL||'',
  provider: extra.provider || 'password',
  gigs:0,
  invites:0,
  createdAt:Date.now()
 };
 await set(ref(db,'users/'+user.uid),data);
 if(refId && refId!==user.uid){ try{ await update(ref(db,'users/'+refId),{invites:increment(1)}); }catch(e){} }
 localStorage.setItem('devchat_user_logged','true');
 location.href='index.html';
}

// GOOGLE
document.getElementById('googleBtn').onclick=async()=>{
 try{
  const provider=new GoogleAuthProvider();
  const res=await signInWithPopup(auth,provider);
  const snap=await get(ref(db,'users/'+res.user.uid));
  if(snap.exists()){ localStorage.setItem('devchat_user_logged','true'); location.href='index.html'; return; }
  document.getElementById('fullName').value=res.user.displayName||'';
  document.getElementById('email').value=res.user.email||'';
  alert('Google ok! Fill WhatsApp, Role, Skills then click Create Account');
 }catch(e){ alert(e.message); }
};

// GITHUB
document.getElementById('githubBtn').onclick=async()=>{
 try{
  const provider=new GithubAuthProvider();
  provider.addScope('user:email');
  provider.addScope('read:user');
  const res=await signInWithPopup(auth,provider);
  const snap=await get(ref(db,'users/'+res.user.uid));
  if(snap.exists()){ localStorage.setItem('devchat_user_logged','true'); location.href='index.html'; return; }
  
  const profile = res._tokenResponse || {};
  const githubUsername = profile.screenName || '';
  
  document.getElementById('fullName').value=res.user.displayName||githubUsername||'';
  document.getElementById('email').value=res.user.email||'';
  document.getElementById('portfolio').value= githubUsername ? `https://github.com/${githubUsername}` : '';
  
  alert(`GitHub connected as ${githubUsername||res.user.displayName}! Fill WhatsApp, Role, Skills then click Create Account - your GitHub link don auto-fill.`);
 }catch(e){ 
  if(e.code==='auth/account-exists-with-different-credential'){
    alert('This email already registered with Google. Use Google login instead.');
  } else {
    alert('GitHub error: '+e.message);
  }
 }
};

// Register with password
document.getElementById('regForm').addEventListener('submit', async e=>{
 e.preventDefault();
 const email=document.getElementById('email').value;
 const password=document.getElementById('password').value;
 if(password.length<6){alert('Password must be at least 6 chars');return;}
 document.getElementById('submitBtn').textContent='Creating...';
 try{
  const cred=await createUserWithEmailAndPassword(auth,email,password);
  await saveUserData(cred.user);
 }catch(err){
  alert(err.message);
  document.getElementById('submitBtn').textContent='Create Account with Password';
 }
});

// Login with password
document.getElementById('loginForm').addEventListener('submit', async e=>{
 e.preventDefault();
 const email=document.getElementById('loginEmail').value;
 const password=document.getElementById('loginPassword').value;
 try{
  const cred=await signInWithEmailAndPassword(auth,email,password);
  localStorage.setItem('devchat_user_logged','true');
  location.href='index.html';
 }catch(err){ alert('Login failed: '+err.message); }
});
</script>
</body>
</html>
