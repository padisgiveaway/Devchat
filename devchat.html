<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>General Chat - DevChat</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box} html,body{margin:0;padding:0;width:100%;overflow-x:hidden}
body{font-family:sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column;background:#E5DDD5}
.chat-left{background:white;border-radius:0 16px 16px 16px;max-width:78%;word-break:break-word}
.chat-right{background:#DCF8C6;border-radius:16px 0 16px 16px;max-width:78%;word-break:break-word}
.adsterra{width:100%;background:white;border:1px solid #eee;display:flex;align-items:center;justify-content:center;min-height:60px;border-radius:12px;overflow:hidden}
.reply-quote{background:rgba(0,0,0,0.08);border-left:3px solid #075E54;padding:4px 8px;border-radius:6px;font-size:11px;margin-bottom:4px}
.reply-quote b{display:block;color:#075E54}
.swipe-msg{transition:transform .2s ease;touch-action:pan-y;position:relative}
.reply-bar{display:none}
.react-picker{position:absolute;top:-38px;left:50%;transform:translateX(-50%);background:white;border-radius:20px;box-shadow:0 4px 15px rgba(0,0,0,.25);padding:5px 8px;display:flex;gap:6px;z-index:20;white-space:nowrap}
.react-picker span{font-size:20px;cursor:pointer}
.react-picker span:hover{transform:scale(1.3)}
.reactions{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.reaction-badge{background:white;border:1px solid #ddd;border-radius:12px;padding:1px 6px;font-size:11px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.react-btn{opacity:.6;font-size:11px;margin-left:4px;cursor:pointer}
</style>
</head>
<body>
<div class="bg-[#075E54] text-white px-3 py-2.5 flex justify-between items-center w-full">
<div class="flex items-center gap-2 min-w-0">
<a href="index.html" class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-arrow-left text-xs"></i></a>
<div class="min-w-0">
<div class="font-black text-[15px]">DevChat - General Chat</div>
<div class="text-[10px] opacity-80 truncate"><span id="totalUsers">0</span> members · <span id="onlineUsers">0</span> online · <span id="offlineUsers">0</span> offline</div>
</div>
</div>
<div class="flex items-center gap-2 flex-shrink-0"><img id="myAvatarTop" class="w-8 h-8 rounded-full hidden border-2 border-white"></div>
</div>
<div class="bg-white p-2 w-full border-b">
<div class="adsterra">
<script>atOptions = {'key' : '50ed0ce2f2d5bcf00ac428ab929a6f99','format' : 'iframe','height' : 50,'width' : 320,'params' : {}};</script>
<script src="https://bicea.org/22/50ed0ce2f2d5bcf00ac428ab929a6f99"></script>
</div>
</div>
<div id="chatMessages" class="flex-1 overflow-y-auto p-3 space-y-3 w-full" style="background-image:url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');background-size:400px"></div>

<div id="replyBar" class="reply-bar bg-white px-3 py-2 border-t flex justify-between items-center w-full">
<div class="min-w-0 flex-1">
<div class="text-[11px] font-bold text-[#075E54]">Replying to <span id="replyToName"></span></div>
<div id="replyToText" class="text-[12px] text-gray-600 truncate"></div>
</div>
<button id="cancelReply" class="w-7 h-7 bg-gray-200 rounded-full flex items-center justify-center flex-shrink-0 ml-2"><i class="fa-solid fa-xmark text-xs"></i></button>
</div>

<div class="bg-[#F0F0F0] p-2 flex gap-2 items-center w-full border-t">
<input id="chatInput" placeholder="Type a message..." class="flex-1 min-w-0 rounded-full px-4 py-2.5 border text-sm focus:outline-none">
<button id="sendBtn" class="bg-[#075E54] text-white w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-paper-plane text-sm"></i></button>
</div>
<script>
// GLOBAL - shared with module script via window
window.myUid = localStorage.getItem('devchat_uid') || '';
window.currentUserName = localStorage.getItem('devchat_name') || 'You';
window.lastMessagesFromDB = null;

const exampleMessages=[
{name:"Michael Johnson",uid:"demo1",photo:"https://i.pravatar.cc/150?img=1",text:"Hello guys! Who sabi React Native? I get gig for una 👋",role:"Fullstack Dev",timestamp:Date.now()-100000},
{name:"Sarah Adams",uid:"demo2",photo:"https://i.pravatar.cc/150?img=2",text:"I dey available! Show me the job for contacts section",role:"Frontend Dev",timestamp:Date.now()-80000},
{name:"Aisha Bello",uid:"demo3",photo:"https://i.pravatar.cc/150?img=4",text:"We dey hire backend devs for fintech. Check jobs tab!",role:"Backend Dev",timestamp:Date.now()-60000},
{name:"DevChat Bot",uid:"bot",photo:"https://ui-avatars.com/api/?name=Bot&background=25D366&color=fff",text:"Welcome to DevChat! Invite 5 friends to unlock jobs section 🚀",role:"Bot",timestamp:Date.now()-40000}
];

let replyTo = null;
let lastMessages = exampleMessages;

function setReply(m){
  replyTo = m;
  document.getElementById('replyToName').textContent = m.name;
  document.getElementById('replyToText').textContent = m.text;
  document.getElementById('replyBar').style.display = 'flex';
  document.getElementById('chatInput').focus();
}
document.getElementById('cancelReply').onclick = function(){
  replyTo = null;
  document.getElementById('replyBar').style.display = 'none';
};

function showReactPicker(bubble, m){
  document.querySelectorAll('.react-picker').forEach(e=>e.remove());
  var picker = document.createElement('div');
  picker.className='react-picker';
  picker.innerHTML='<span>❤️</span><span>😂</span><span>👍</span><span>🔥</span><span>😮</span><span>😢</span>';
  picker.querySelectorAll('span').forEach(s=>{
    s.onclick = (e)=>{ e.stopPropagation(); addReaction(m, s.textContent); picker.remove(); };
  });
  bubble.appendChild(picker);
  setTimeout(()=>{ document.addEventListener('click', function h(){ picker.remove(); document.removeEventListener('click', h); }); }, 100);
}

function addReaction(m, emoji){
  if(!m.reactions) m.reactions = {};
  let myKey = window.myUid || window.currentUserName;
  if(m.reactions[myKey] === emoji){ delete m.reactions[myKey]; } else { m.reactions[myKey] = emoji; }
  if(m._key && window.saveReaction){
    window.saveReaction(m._key, myKey, m.reactions[myKey] || null);
  }
  renderChatMessages(lastMessages);
}

function reactionsHTML(m){
  if(!m.reactions) return '';
  var counts = {};
  Object.values(m.reactions).forEach(e=>{ counts[e]=(counts[e]||0)+1; });
  var html = '<div class="reactions">';
  for(var e in counts){ html += '<span class="reaction-badge">'+e+' '+counts[e]+'</span>'; }
  html += '</div>';
  return html;
}

function renderChatMessages(messages){
lastMessages = messages || exampleMessages;
var box=document.getElementById('chatMessages'); if(!box) return; box.innerHTML='';
(lastMessages).forEach(function(m,idx){

// *** THE ONLY RULE: UID == MY UID = RIGHT, ELSE LEFT ***
var isMe = false;
if(window.myUid && m.uid && String(m.uid).trim() === String(window.myUid).trim()){
  isMe = true;
}

var div=document.createElement('div'); div.className='flex gap-2 w-full '+(isMe?'justify-end':'');
var inner = document.createElement('div');
inner.className = 'swipe-msg flex gap-2 ' + (isMe?'flex-row-reverse':'') + ' w-full ' + (isMe?'justify-end':'');
inner.style.maxWidth='100%';

var quoteHtml = '';
if(m.replyTo){
  quoteHtml = '<div class="reply-quote"><b>'+m.replyTo.name+'</b>'+m.replyTo.text+'</div>';
}
var bubbleHtml = '';
if(isMe){
  bubbleHtml = '<div class="chat-right px-3 py-2 relative">'+quoteHtml+'<div class="text-[13px]">'+m.text+'</div>'+reactionsHTML(m)+'<div class="text-[10px] text-gray-600 text-right mt-1">'+new Date(m.timestamp||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' ✓✓ <span class="react-btn" data-react="1">😊</span></div></div>';
} else {
  bubbleHtml = '<img src="'+(m.photo||'https://ui-avatars.com/api/?name='+encodeURIComponent(m.name))+'" class="w-8 h-8 rounded-full flex-shrink-0 object-cover"><div class="chat-left px-3 py-2 relative"><div class="text-[11px] font-bold text-[#075E54] truncate">'+m.name+' • '+(m.role||'')+'</div>'+quoteHtml+'<div class="text-[13px] mt-1">'+m.text+'</div>'+reactionsHTML(m)+'<div class="text-[10px] text-gray-500 text-right mt-1">'+new Date(m.timestamp||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' <span class="react-btn" data-react="1">😊</span></div></div>';
}
inner.innerHTML = bubbleHtml;

var reactBtn = inner.querySelector('[data-react]');
if(reactBtn){ reactBtn.onclick = (e)=>{ e.stopPropagation(); showReactPicker(reactBtn.parentElement, m); }; }

let pressTimer=null;
inner.addEventListener('touchstart', e=>{ pressTimer=setTimeout(()=>{ showReactPicker(inner.querySelector('.chat-left, .chat-right')||inner, m); }, 500); }, {passive:true});
inner.addEventListener('touchend', ()=>{ clearTimeout(pressTimer); }, {passive:true});

let startX=0, currentX=0, swiping=false;
inner.addEventListener('touchstart', e=>{ startX=e.touches[0].clientX; swiping=true; }, {passive:true});
inner.addEventListener('touchmove', e=>{ if(!swiping) return; currentX=e.touches[0].clientX - startX; if(currentX>0 && currentX<80){ inner.style.transform='translateX('+currentX+'px)'; } }, {passive:true});
inner.addEventListener('touchend', e=>{ swiping=false; if(currentX>45){ setReply(m); } inner.style.transform='translateX(0px)'; currentX=0; });
inner.addEventListener('dblclick', ()=> setReply(m));

div.appendChild(inner);
box.appendChild(div);
});
box.scrollTop=box.scrollHeight;
}
renderChatMessages(exampleMessages);
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { getDatabase, ref, onValue, push, query, orderByChild, limitToLast, set, remove } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyD1XfAONBJW_XMV_55PMnySMb4wQ8rKywc",authDomain:"devchat-52024.firebaseapp.com",databaseURL:"https://devchat-52024-default-rtdb.firebaseio.com",projectId:"devchat-52024",storageBucket:"devchat-52024.firebasestorage.app",messagingSenderId:"906277143318",appId:"1:906277143318:web:2d81125db5ef04f3a44637"};
const app=initializeApp(firebaseConfig); 
const auth=getAuth(app); 
const db=getDatabase(app);

window.saveReaction = async (msgKey, userKey, emoji)=>{
  try{
    if(!emoji) await remove(ref(db, 'messages/'+msgKey+'/reactions/'+userKey));
    else await set(ref(db, 'messages/'+msgKey+'/reactions/'+userKey), emoji);
  }catch(e){}
};

onAuthStateChanged(auth, async u=>{ 
  if(!u) return; 
  // SAVE UID GLOBALLY
  window.myUid = u.uid;
  localStorage.setItem('devchat_uid', u.uid);
  window.currentUserName = u.displayName || (u.email ? u.email.split('@')[0] : 'You');
  localStorage.setItem('devchat_name', window.currentUserName);
  const av=document.getElementById('myAvatarTop'); 
  if(av){av.src=u.photoURL||`https://ui-avatars.com/api/?name=${encodeURIComponent(u.displayName||'Dev')}`; av.classList.remove('hidden');}
  // FORCE RE-RENDER so your messages jump to RIGHT
  if(window.lastMessagesFromDB) renderChatMessages(window.lastMessagesFromDB);
  else renderChatMessages(lastMessages);
});

onValue(ref(db,'users'), snap=>{
  let all=[];
  snap.forEach(c=>{all.push(c.val());});
  let online=0;
  all.forEach(u=>{
    let isOnline=false;
    if(u.isOnline===true || u.status==="online") isOnline=true;
    else if(u.lastSeen){
      const diff=Date.now() - new Date(u.lastSeen).getTime();
      if(diff < 5*60*1000) isOnline=true;
    }
    if(isOnline) online++;
  });
  document.getElementById('totalUsers').textContent=all.length;
  document.getElementById('onlineUsers').textContent=online;
  document.getElementById('offlineUsers').textContent=all.length-online;
});

onValue(query(ref(db,'messages'),orderByChild('timestamp'),limitToLast(100)), snap=>{if(!snap.exists()) return; let m=[]; snap.forEach(c=>{ let v=c.val(); v._key=c.key; m.push(v); }); if(m.length>0){ window.lastMessagesFromDB=m; renderChatMessages(m); }});
const sendBtn=document.getElementById('sendBtn'); const chatInput=document.getElementById('chatInput');
async function sendMsg(){ 
  if(!chatInput.value.trim()) return; 
  let text = chatInput.value;
  // *** ALWAYS SEND UID WITH MESSAGE ***
  let myUidNow = auth.currentUser ? auth.currentUser.uid : window.myUid;
  let myNameNow = auth.currentUser ? (auth.currentUser.displayName || auth.currentUser.email.split('@')[0]) : window.currentUserName;
  let myPhotoNow = auth.currentUser ? (auth.currentUser.photoURL || document.getElementById('myAvatarTop')?.src) : document.getElementById('myAvatarTop')?.src;
  let msgData = {name: myNameNow, uid: myUidNow || '', text: text, timestamp: Date.now(), photo: myPhotoNow || 'https://ui-avatars.com/api/?name=You&background=25D366&color=fff'};
  if(replyTo){ msgData.replyTo = {name: replyTo.name, text: replyTo.text}; replyTo=null; document.getElementById('replyBar').style.display='none'; }
  try{await push(ref(db,'messages'), msgData); chatInput.value='';}catch(e){const box=document.getElementById('chatMessages'); const div=document.createElement('div'); div.className='flex gap-2 justify-end w-full'; div.innerHTML='<div class="chat-right px-3 py-2"><div class="text-[13px]">'+text+'</div></div>'; box.appendChild(div); box.scrollTop=box.scrollHeight; chatInput.value='';}
}
if(sendBtn) sendBtn.onclick=sendMsg; if(chatInput) chatInput.onkeydown=e=>{if(e.key==='Enter') sendMsg();};
</script>
</body>
</html>
